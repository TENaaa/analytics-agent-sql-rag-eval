[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-agent-sql-rag-eval"
version = "0.1.0"
description = "Metric dictionary driven web analytics agent with SQL, RAG-style retrieval and evaluation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "httpx>=0.28",
]

[project.scripts]
analytics-agent = "analytics_agent.__main__:main"
